# Render Blueprint: creates the web service when you "New > Blueprint" this repo.
# Free instance: no persistent disk, so the app is read-only and data arrives via Git
# (see .github/workflows/collect.yml).

services:
  - type: web
    name: insightmetric
    runtime: python
    plan: free
    region: frankfurt
    branch: main
    buildCommand: pip install -r requirements.txt
    startCommand: streamlit run Daily_Trends.py --server.port $PORT --server.address 0.0.0.0 --server.headless true
    healthCheckPath: /_stcore/health
    autoDeployTrigger: commit
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: DEPLOYED
        value: "1"
      - key: STREAMLIT_BROWSER_GATHER_USAGE_STATS
        value: "false"

  - type: web
    name: insightmetric-backend
    runtime: python
    plan: free
    region: frankfurt
    branch: main
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT

cronJobs:
  - name: daily-ingest
    schedule: "0 6 * * *"
    serviceName: insightmetric-backend
    path: "/run-daily-ingest"
    method: "GET"
