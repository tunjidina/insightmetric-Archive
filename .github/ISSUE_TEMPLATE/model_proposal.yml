name: Model or feature proposal
description: Change the model, add a feature, or alter the prediction target.
labels: ["model", "enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        The model is small on purpose, and it is the least developed part of the project —
        good ideas are welcome. Please read
        [Proposing a model change](../blob/main/CONTRIBUTING.md#proposing-a-model-change) first.
        **Random-split metrics are not evidence** and will be rejected: the target is
        forward-looking, so the split must be chronological.

  - type: dropdown
    id: kind
    attributes:
      label: What kind of change is this?
      options:
        - A new feature (most welcome)
        - A change to an existing feature
        - A different model class
        - A change to the prediction target
        - A change to how recurrence is labelled
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: What are you proposing, and why should it help?
      description: State the mechanism, not just the idea. Why would this carry signal?
      placeholder: >
        The ratio of HN comments to points separates stories being argued about from those
        being quietly upvoted. Contested stories plausibly persist differently from
        consensus ones, and neither raw number captures that.
    validations:
      required: true

  - type: textarea
    id: results
    attributes:
      label: Results against the current baseline
      description: |
        Use `src/train.py`, which splits chronologically. Current numbers to beat:
        baseline 0.560 · accuracy 0.660 · F1 0.667 · ROC-AUC 0.709
      value: |
        | Metric   | Current | Proposed |
        |----------|---------|----------|
        | Accuracy | 0.660   |          |
        | F1       | 0.667   |          |
        | ROC-AUC  | 0.709   |          |
    validations:
      required: false

  - type: dropdown
    id: dataset
    attributes:
      label: Which dataset produced those numbers?
      description: >
        The committed history is synthetic and generated by a noisy logistic rule, which
        flatters linear models. A result on real collected data is far more interesting.
      options:
        - Synthetic (the committed 45-day history)
        - Real collected data
        - Not measured yet — proposal only
    validations:
      required: true

  - type: input
    id: days
    attributes:
      label: If real data, how many days does it cover?
      placeholder: "31 days"
    validations:
      required: false

  - type: checkboxes
    id: constraints
    attributes:
      label: Constraints
      options:
        - label: No new paid service, API key or hosted inference endpoint
          required: true
        - label: Training still runs in seconds on CPU, with no GPU
          required: false
        - label: The result can still be explained without an interpretability library
          required: false
